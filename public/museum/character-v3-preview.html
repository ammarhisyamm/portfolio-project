<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hisyam — Character v3</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#222326;color:#e9e4da;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100dvh;touch-action:none}
    header{position:fixed;top:24px;left:24px;pointer-events:none}h1{font:28px Georgia,serif;margin:0 0 8px}p{max-width:290px;margin:0;color:#b9b7b2;line-height:1.6}
    nav{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(90%,700px)}button,a{border:1px solid #676057;background:#292725;color:#eee5d6;border-radius:24px;padding:10px 17px;text-decoration:none;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#ddd1bc;color:#1b1a18}button:focus-visible,a:focus-visible{outline:2px solid #d6b579;outline-offset:4px}
    #status{position:fixed;right:24px;top:24px;color:#bbb6ab}@media(max-width:600px){header{top:18px;left:18px}h1{font-size:23px}p{max-width:220px;font-size:12px}#status{top:110px;left:18px;right:auto}nav{bottom:16px;gap:6px}button,a{padding:9px 13px;font-size:12px}}
  </style>
</head>
<body>
  <header><h1>Hisyam · character study</h1><p>Custom 3D mesh, skin-weighted limbs, and four animation clips. Drag to orbit; scroll to inspect.</p></header>
  <div id="status" role="status">Loading the model…</div>
  <nav aria-label="Character preview controls">
    <button data-clip="Idle" aria-pressed="true">Idle</button><button data-clip="Walk" aria-pressed="false">Walk</button><button data-clip="Run" aria-pressed="false">Run</button><button data-clip="Interact" aria-pressed="false">Interact</button>
    <button id="face">Face detail</button><button id="full">Full body</button><a href="/museum/hisyam-character-v3.glb" download>Download GLB</a>
  </nav>
  <script type="module" src="/museum/character-v3-preview.js"></script>
</body>
</html>
